<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="560" viewBox="0 0 1080 560" role="img" aria-labelledby="t">
  <title id="t">Rozhodování v obou vesnicích</title>
  <style>text{font:16px "Segoe UI",sans-serif;text-anchor:middle;fill:#33382c}.title{font:bold 21px Georgia,serif}.arrow{fill:none;stroke:#665637;stroke-width:2.5;marker-end:url(#end)}</style>
  <defs><marker id="end" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#665637"/></marker></defs>
  <rect width="1080" height="560" rx="16" fill="#f0e7d4"/>
  <path class="arrow" d="M540 101v26"/><path class="arrow" d="M540 206v16H283v20"/><path class="arrow" d="M540 206v16H797v20"/>
