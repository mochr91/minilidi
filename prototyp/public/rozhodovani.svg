<g><rect x="120" y="20" width="840" height="81" rx="12" fill="#fff8e8" stroke="#a79675"/><text x="540" y="49" class="title">Stav vesnice</text><text x="540" y="74">Čas a předpověď • zásoby • potřeby • vztahy • víra • paměť</text></g><g><rect x="220" y="130" width="640" height="76" rx="12" fill="#fff8e8" stroke="#a79675"/><text x="540" y="159" class="title">Povolené úkoly po postavách</text><text x="540" y="184">Každých 6 hodin · věk, denní doba, počasí a dostupnost</text></g><g><rect x="63" y="244" width="440" height="95" rx="12" fill="#e1ead7" stroke="#a79675"/><text x="283" y="273" class="title">Vesnice s AI</text><text x="283" y="298">Ollama navrhne plán, důvod i myšlenku.</text><text x="283" y="317">Chybějící položku doplní pravidla.</text></g><g><rect x="577" y="244" width="440" height="95" rx="12" fill="#e9e2d2" stroke="#a79675"/><text x="797" y="273" class="title">Vesnice bez AI</text><text x="797" y="298">Hra seřadí dostupné úkoly podle skóre.</text><text x="797" y="317">Zohlední zásoby, profese a opakování.</text></g><g><rect x="220" y="375" width="640" height="69" rx="12" fill="#f7edcf" stroke="#a79675"/><text x="540" y="404" class="title">Společné pojistky a kontrola</text><text x="540" y="429">Odpočinek při únavě • návštěva při nízké náladě či zábavě</text></g><g><rect x="120" y="470" width="840" height="72" rx="12" fill="#fff8e8" stroke="#a79675"/><text x="540" y="499" class="title">Práce, setkání a výsledek</text><text x="540" y="524">Kronika • nové zásoby a vztahy • vzpomínky do příštího kola</text></g></svg>
