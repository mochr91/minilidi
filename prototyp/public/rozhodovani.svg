<g><rect x="120" y="20" width="840" height="81" rx="12" fill="#fff8e8" stroke="#a79675"/><text x="540" y="49" class="title">Stav vesnice</text><text x="540" y="74">Čas a předpověď • zásoby • potřeby • vztahy • víra • paměť</text></g><g><rect x="220" y="130" width="640" height="76" rx="12" fill="#fff8e8" stroke="#a79675"/><text x="540" y="159" class="title">Povolené úkoly po postavách</text><text x="540" y="184">Každých 6 hodin · věk, denní doba, počasí a dostupnost</text></g><g><rect x="63" y="244" width="440" height="117" rx="12" fill="#e1ead7" stroke="#a79675"/><text x="283" y="273" class="title">Vesnice s AI</text><text x="283" y="298">Ollama plánuje nejvýš 8 postav na dotaz.</text><text x="283" y="317">Při chybě zkusí jednou dotaz jen na úkoly.</text><text x="283" y="340">Chybějící úkoly vyberou pravidla.</text></g><g><rect x="577" y="244" width="440" height="117" rx="12" fill="#e9e2d2" stroke="#a79675"/><text x="797" y="273" class="title">Vesnice bez AI</text><text x="797" y="298">Hra seřadí dostupné úkoly podle skóre.</text><text x="797" y="317">Zásoby, profese a pestrost práce ovlivní výběr.</text></g><g><rect x="220" y="397" width="640" height="69" rx="12" fill="#f7edcf" stroke="#a79675"/><text x="540" y="426" class="title">Společné pojistky a kontrola</text><text x="540" y="451">Krize • odpočinek a návštěvy • zajištění jídla • výběr stavby</text></g><g><rect x="120" y="492" width="840" height="88" rx="12" fill="#fff8e8" stroke="#a79675"/><text x="540" y="521" class="title">Práce, setkání a výsledek</text><text x="540" y="545">Sklizeň, řemesla a stavby • vztahy • kronika</text><text x="540" y="567">Denní vzpomínky • záznam vlivu AI na výběr úkolů</text></g></svg>
